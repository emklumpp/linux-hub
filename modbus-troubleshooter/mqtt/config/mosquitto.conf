# Mosquitto configuration for the Modbus troubleshooting test stack.
# Anonymous access is enabled for local testing only — do not expose this
# broker to an untrusted network without authentication.

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
