[package]
name = "flock-fetch"
version = "0.1.0"
edition = "2021"
description = "Pull ALPR/Flock camera nodes from OpenStreetMap (Overpass) for the Denver metro"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
